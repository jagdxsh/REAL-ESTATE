<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF5B7" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA771C" />
      <stop offset="75%" stop-color="#E6CA65" />
      <stop offset="100%" stop-color="#8F5B12" />
    </linearGradient>
    
    <!-- Dark Radial Gradient for Badge -->
    <radialGradient id="badgeDark" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Subtle Gold Rim Glow -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E05E" />
      <stop offset="50%" stop-color="#B7791F" />
      <stop offset="100%" stop-color="#744210" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Ring / Black Badge -->
  <circle cx="200" cy="180" r="160" fill="url(#badgeDark)" stroke="url(#goldRim)" stroke-width="4.5" filter="url(#dropShadow)" />
  <circle cx="200" cy="180" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="6,4" />

  <!-- Interlaced Monogram V and M in Serif Gold -->
  <g filter="url(#dropShadow)">
    <!-- Letter M (Behind V) -->
    <path d="M 90 270 L 90 90 L 125 90 L 200 215 L 275 90 L 310 90 L 310 270 L 275 270 L 275 140 L 215 240 L 185 240 L 125 140 L 125 270 Z" 
          fill="url(#goldGrad)" />
    
    <!-- Letter V (Interlaced Front) with Distinct Bevel/Contrast -->
    <path d="M 120 75 L 165 75 L 200 250 L 235 75 L 280 75 L 218 285 L 182 285 Z" 
          fill="url(#goldGrad)" stroke="#0F172A" stroke-width="3.5" />
    
    <!-- Top Serifs for V -->
    <rect x="110" y="70" width="60" height="7" rx="2" fill="url(#goldGrad)" stroke="#0F172A" stroke-width="1"/>
    <rect x="230" y="70" width="60" height="7" rx="2" fill="url(#goldGrad)" stroke="#0F172A" stroke-width="1"/>
    <!-- Bottom Serifs for M -->
    <rect x="80" y="265" width="55" height="7" rx="2" fill="url(#goldGrad)"/>
    <rect x="265" y="265" width="55" height="7" rx="2" fill="url(#goldGrad)"/>
  </g>

  <!-- Wordmark 'INTELLECT' in Refined Typography with Underline Arch -->
  <g transform="translate(200, 362)">
    <path d="M -160 -15 Q 0 5 160 -15" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    <text x="0" y="10" 
          font-family="'Cinzel', 'Trajan Pro', 'Cinzel Decorative', 'Georgia', serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="9" 
          fill="url(#goldGrad)" 
          text-anchor="middle"
          filter="url(#dropShadow)">
      INTELLECT
    </text>
  </g>
</svg>
